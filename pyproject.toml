[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-decision-layer"
version = "0.1.0"
description = "Simulation, data, optimization, and evaluation foundation for AI data-centre energy decisions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "YCW27 contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
sim = ["gymnasium>=1.0,<2"]
data = ["pandas>=2.2,<3", "pyarrow>=15,<22"]
optimizer = ["scipy>=1.13,<2"]
all = [
  "gymnasium>=1.0,<2",
  "pandas>=2.2,<3",
  "pyarrow>=15,<22",
  "scipy>=1.13,<2",
]
dev = [
  "gymnasium>=1.0,<2",
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<2",
  "pandas>=2.2,<3",
  "pyarrow>=15,<22",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "scipy>=1.13,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
energy_decision_layer = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "benchmark: performance benchmark not run in the default suite",
  "external: requires a live external service or credential",
  "integration: crosses two or more package components",
  "invariant: validates a physical or conservation property",
  "slow: intentionally slower validation",
]

[tool.coverage.run]
branch = true
source = ["energy_decision_layer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
packages = ["energy_decision_layer"]


[[tool.mypy.overrides]]
module = ["pandas", "scipy.*"]
ignore_missing_imports = true
