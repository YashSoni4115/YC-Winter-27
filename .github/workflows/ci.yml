name: Python validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]' build
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m mypy src/energy_decision_layer
      - run: python -m pytest -m 'not external and not slow and not benchmark' --cov=energy_decision_layer --cov-report=xml --junitxml=artifacts/junit.xml
      - run: python -m energy_decision_layer etl examples/synthetic.csv --synthetic --output artifacts/etl
      - run: python -m energy_decision_layer benchmark --steps 8 --output artifacts/benchmark
      - run: python -m energy_decision_layer train-all --steps 120 --config configs/ci-training.json
      - run: python -m energy_decision_layer demo --steps 8 --output artifacts/demo-ci
      - run: python -m energy_decision_layer evaluate-ml --steps 4 --output artifacts/ml-evaluation
      - run: node --check src/energy_decision_layer/service/static/app.js
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python-version }}
          path: |
            artifacts/
            coverage.xml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements-dev.lock -e '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m energy_decision_layer train-all --steps 120 --config configs/ci-training.json
      - run: python -m energy_decision_layer evaluate-ml --steps 4 --output artifacts/ml-evaluation
      - run: python examples/browser_smoke.py --output artifacts/browser-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: artifacts/browser-smoke/
  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - run: python -m energy_decision_layer benchmark --steps 288 --output artifacts/daily-benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: daily-benchmark
          path: artifacts/daily-benchmark/
